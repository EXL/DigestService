name: Build

on:
  push:
    # tags:
    #  - '**'
    branches:
       - '**'

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-service-jar
          path: build/libs/*.jar
