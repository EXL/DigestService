plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.exlmoto'
version = '1.0.2'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

springBoot {
	buildInfo {
		properties {
			additional = [
				'revision': getShortGitRevision()
			]
		}
	}
}

dependencies {
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'

	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	runtimeOnly 'org.postgresql:postgresql'

	implementation 'com.github.pengrad:java-telegram-bot-api:10.1.0'
	implementation 'org.kohsuke:github-api:2.0-rc.7'
	implementation 'org.yaml:snakeyaml:2.6'
	implementation 'org.jsoup:jsoup:1.23.1'
	implementation 'org.nibor.autolink:autolink:0.12.0'
	implementation 'org.owasp.encoder:encoder:1.4.0'
	implementation 'org.apache.poi:poi:5.5.1'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'

	/* @WithMockUser, @WithUserDetails, SecurityMockMvcRequestPostProcessors.csrf() */
	testImplementation 'org.springframework.security:spring-security-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def getShortGitRevision() {
	try {
		def branch = providers.exec {
			commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
		}.standardOutput.asText.get().trim()

		def commit = providers.exec {
			commandLine 'git', 'rev-parse', '--short', 'HEAD'
		}.standardOutput.asText.get().trim()

		def count = providers.exec {
			commandLine 'git', 'rev-list', '--count', 'HEAD'
		}.standardOutput.asText.get().trim()

		return "${branch}_${commit}_${count}"
	} catch (Exception ignored) {
		logger.warn('Cannot get information from Git commands. Is Git installed?')
		return 'unknown'
	}
}
