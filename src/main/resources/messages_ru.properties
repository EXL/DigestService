site.help.title.about=О сервисе…
site.help.about=<strong class="help-command">Digest Service</strong> — это Telegram-бот для групповых чатов, \
совмещённый с этим Web-ресурсом. Основная функциональность сервиса заключается в том, \
чтобы сохранять сообщения с тегом <strong class="help-command">#digest</strong> в Telegram-чатах и отображать их \
по команде <strong class="help-command">/digest</strong>, помимо этого бот обладает другими возможностями, например, \
умеет подписывать пользователей на различные информационные каналы и показывает различные котировки валют и \
драгоценных металлов.
site.help.command.digest=&bull; <strong class="help-command">/digest</strong> \
— Показать сообщения с тегом <strong class="help-command">#digest</strong>, которые были собраны в текущем \
Telegram-чате за неделю или за всё время.
site.help.command.digest.alt=Команда /digest, результат выполнения.
site.help.command.digest.desc=\
Сообщения, добавленные последними, находятся вверху. В заголовке дайджеста имеется небольшая статистика, \
отображающая общее число дайджестов в чате, текущую страницу и их количество. \
Кнопки, переключающие страницы, отображаются лишь тогда, когда было собрано более %message% сообщений.<br/><br/>\
Для текста, который помещается в вывод команды, имеются следующие ограничения:<br/>\
1. Все переводы строк из сообщения вырезаются.<br/>\
2. Из упоминаний пользователей вырезается символ обращения <strong class="help-command">@</strong>, \
при этом он сохраняется в самой базе данных.<br/>\
3. Длина добавляемого сообщения не может превышать %length% символов.<br/><br/>\
Эксклюзивные возможности для Telegram-чата MotoFan.Ru:<br/>\
1. Сообщения хранятся всё время, а не только неделю.<br/>\
2. Сообщения сразу после их добавления в дайджест публикуются на этот сайт.<br/>\
3. Стрелочка <strong class="help-command">→️</strong> после текста дайджеста позволяет \
найти данное сообщение в чате и перейти к нему. Стелочка активна лишь для дайджестов, добавленных после 28-Mar-2020, \
это связано с переездом бота на новую платформу.
site.help.command.rate=&bull; <strong class="help-command">/rate</strong> \
— Показать актуальные котировки валют и драгоценных металов различных национальных банков.
site.help.command.rate.alt=Команда /rate, результат выполнения.
site.help.command.rate.desc=\
Котировки обновляются каждый день дважды, разница рассчитывается на основе предыдущего значения. \
Для собственных нужд можно использовать \
<a href="/api/rate" title="Котировки валют и металлов." target="_blank">специальное API</a>, \
выводящее котировки в удобном формате JSON.<br/><br/>\
В качестве официальных источников используются следующие национальные банки:<br/>\
1. Банк России (ЦБ РФ), используется для определения курса рубля и драгоценных металлов.<br/>\
2. Национальный банк Украины (НБУ), используется для определения курса гривны.<br/>\
3. Национальный банк Республики Беларусь (НБ РБ), используется для определения курса белорусского рубля.<br/>\
4. Национальный банк Казахстана (НБК), используется для определения курса тенге.<br/><br/>\
<em>Помните, что официальные курсы валют и драгоценных металлов могут отличаться от рыночных. \
Используйте команду <strong class="help-command">/charts️</strong> для получения графиков \
с различных торговых площадок.</em>
site.help.command.chart=&bull; <strong class="help-command">/chart</strong> \
— Показать графики котировок валют и драгоценных металов с различных торговых площадок.<br/><br/>\
После выполнения команды в чат отправляется сообщение, в котором можно нажать кнопку для получения графика \
интересующей вас котировки, после чего график тоже будет отправлен в чат. Добавление и удаление графиков производится \
в файле <a href="//github.com/EXL/DigestService/blob/master/src/main/resources/chart/charts.yaml" \
title="Файл charts.yaml в репозитории проекта." target="_blank">charts.yaml</a>, который имеет формат YAML.
site.help.command.start=&bull; <strong class="help-command">/start</strong> \
— Начальная команда, показывающая приветствие и отправляющая пользователя читать справку по командам.
site.help.command.coffee=&bull; <strong class="help-command">/coffee</strong> \
— Отправить в текущий чат стикер с большой чашкой кофе.
site.help.command.game=&bull; <strong class="help-command">/game</strong> \
— Отправить в чат статистику различных игровых серверов.
site.help.command.game.alt=Команда /game, результат выполнения.
site.help.command.game.desc=\
На этих серверах участники чата могут собраться и поиграть в интересующие их мультиплеерные компьютерные игры, \
провести различные турниры и соревнования.
site.help.command.subscribe=&bull; <strong class="help-command">/subscribe</strong> \
— Подписаться на различные информационные каналы.
site.help.command.subscribe.alt=Команда /subscribe, результат выполнения.
site.help.command.subscribe.desc=\
Команда позволяет подписывать Telegram-чаты на различные информационные каналы, \
список которых со временем может изменяться. Администраторы бота могут подписывать различные группы в Telegram, \
а обычные пользователи только свои собственные диалоги с ботом.<br/><br/>\
Актуальные источники информации и их особенности:<br/>\
1. Подписка на сообщения, которые были отправлены участниками Telegram-чата MotoFan.Ru в дайджест. \
Сообщения отправляются сразу, если пользователь сам оставил дайджест, то ему в диалог с \
ботом сообщение отправлено не будет.<br/>\
2. Подписка на новые сообщения с форума MotoFan.Ru, которые отправляются скопом каждые 20 минут.<br/>\
3. Подписка на отчёт по пандемии COVID-19 в Российской Федерации, отчёт отправляется ежедневно.<br/><br/>\
4. Подписка на отчёт по пандемии COVID-19 в Украине, отчёт отправляется ежедневно.<br/><br/>\
Для различных нужд были подготовлены соответствующие API \
(<a href="/api/covid/ru" title="Пандемия COVID-19 в Российской Федерации." target="_blank">Ru</a>, \
<a href="/api/covid/ua" title="Пандемия COVID-19 в Украине." target="_blank">Ua</a>), \
выдающие информацию в формате JSON.
site.help.command.help=&bull; <strong class="help-command">/help</strong> \
— Вывести в чат справку по командам бота.<br/><br/>\
<em>Справка является динамической и отображение команд рассчитывается на основе текущих прав юзера в группе и наличия \
у него администраторских полномочий по управлению ботом.</em>
site.help.command.greeting=&bull; <strong class="help-command">/greeting</strong> \
— Настройка приветствий от бота в группе.
site.help.command.greeting.alt=Команда /greeting, результат выполнения.
site.help.command.greeting.desc=\
Администраторы группы могут отключить приветствия бота, которые он отправляет новым участникам конференции или \
пользователям, которые её покинули. По умолчанию приветствия включены. Настройка полезна, если у вас в группе уже \
имеется бот, который встречает пользователей.
site.help.command.hello=&bull; <strong class="help-command">/hello</strong> \
или <strong class="help-command">/hi</strong> — Отправить в ответ случайное приветствие бота.
site.help.command.show=&bull; <strong class="help-command">/show</strong> \
— Команда позволяет посмотреть все дайджесты во всех группах, сохранённые в базе данных.
site.help.command.show.alt=Команда /show, результат выполнения.
site.help.command.show.desc=\
Аналог команды <strong class="help-command">/digest</strong>, предназначенный для администраторов. \
Эту команду удобно использовать в связке с командой <strong class="help-command">/delete</strong> для удаления \
некорректных сообщений.<br/><br/>\
<em>Команда может отображать некоторые приватные данные, \
поэтому её использование в публичных чатах не рекомендуется.</em>
site.help.command.delete=&bull; <strong class="help-command">/delete</strong> \
<strong class="help-argument">[id]</strong> — Удалить дайджест из базы данных под номером [id].<br/><br/>\
Команда используется в связке с командой <strong class="help-command">/show</strong>, в качестве аргумента \
используется номер [id] сообщения из базы данных.
site.help.command.send=&bull; <strong class="help-command">/send</strong> \
<strong class="help-argument">[id]</strong> <strong class="help-argument">[сообщение]</strong> \
— Отправить [сообщение] в чат с номером [id] от имени бота.<br/><br/>\
Бот должен находиться в чате и иметь возможность отправки сообщений. \
Узнать номер [id] чата можно с помощью команды <strong class="help-command">/subscribe</strong>, \
вызвав её в нужном чате заранее. Переносы строк в отправленном сообщении не вырезаются.
site.help.command.sticker=&bull; <strong class="help-command">/sticker</strong> \
<strong class="help-argument">[id]</strong> <strong class="help-argument">[hash]</strong> \
— Отправить стикер [hash] в чат с номером [id] от имени бота.<br/><br/>\
Бот должен находиться в чате и иметь возможность отправки сообщений. \
Узнать номер [id] чата можно с помощью команды <strong class="help-command">/subscribe</strong>, \
вызвав её в нужном чате заранее. Узнать [hash] стикера можно с помощью сторонних сервисов, например, через бота \
<a href="//t.me/idstickerbot" title="Специальный бот, отображающий [hash] отправленных ему стикеров." \
target="_blank">@idstickerbot</a>, просто отправив ему необходимый стикер.
site.help.command.image=&bull; <strong class="help-command">/image</strong> \
<strong class="help-argument">[id]</strong> <strong class="help-argument">[ссылка]</strong> \
— Отправить изображение по [ссылке] в чат с номером [id] от имени бота.<br/><br/>\
Бот должен находиться в чате и иметь возможность отправки сообщений. \
Узнать номер [id] чата можно с помощью команды <strong class="help-command">/subscribe</strong>, \
вызвав её в нужном чате заранее. Бот скачивает изображение по [ссылке] и отправляет его в чат. \
Рекомендуется использовать прямые ссылки на изображения.
site.help.command.debug=&bull; <strong class="help-command">/debug</strong> \
— Администраторская команда для изменения различных параметров бота и управления различными службами.
site.help.command.debug.alt=Команда /debug, результат выполнения.
site.help.command.debug.desc=\
Команда, выполненная без аргументов показывает справку и текущие настройки бота. С помощью аргументов, \
которые передаются в команду, можно изменять различные параметры и управлять различными службами.<br/><br/>\
Список актуальных аргументов команды:<br/><div class="help-shift">\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VRates</strong> \
— Обновление котировок в базе данных со всех официальных источников.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VRatesSub</strong> \
— Отправить котировки валют в чаты всем подписчикам.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VPosts</strong> \
— Незамедлительно получить новые сообщения с форума MotoFan.Ru, \
если таковые сообщения имеются, они будут отправлены подписчикам.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VShredder</strong> \
— Очистить базу данных от старых и неактуальных дайджестов (Telegram-чат MotoFan.Ru будет проигнорирован).<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VAvatars</strong> \
— Обновить аватары пользователей, которые отображаются на этом сайте.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VQueries</strong> \
— Очистить стек inline-запросов, который служит для ограничения нажатий на кнопки бота.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VCovid</strong> \
— Получить и отправить отчёты по COVID-19 во все чаты подписчикам.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VBirthday</strong> \
— Отправить фразу с добрым утром и дни рождения в Telegram-чат MotoFan.Ru, фраза будет выбрана случайная.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">VFlat</strong> \
— Отправить варианты недвижимости в личный чат.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">BLogUpdates</strong> \
— Изменение глобальной настройки вывода обновлений в Telegram-чатах в логи на сервере.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">BGreetings</strong> \
— Изменение глобальной настройки приветствий бота на новых и покинувших чат пользователей.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">BBirthday</strong> \
— Изменение глобальной настройки отправки дней рождения пользователей форума MotoFan.Ru.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">BCaptcha</strong> \
— Изменение глобальной настройки использования CAPTCHA для новых пользователей.<br/>\
&bull; <strong class="help-command">/debug</strong> <strong class="help-argument">BSilent</strong> \
— Изменение глобальной настройки вывода любых сообщений бота в любые Telegram-чаты.</div>
site.help.command.info=&bull; <strong class="help-command">/info</strong> \
— Команда отображает различную системную информацию и нагрузку на систему.<br/><br/>\
Для удобства имеется API, представляющее \
<a href="/api/info" title="Информация об этой системе." target="_blank">системную информацию</a> \
в обычном текстовом формате.
site.help.other=\
Помимо самого Telegram-бота, <strong class="help-command">Digest Service</strong> имеет несколько служб, \
которые работают в фоне и занимаются получением дополнительной информации или обслуживанием.<br/><br/>\
Список работающих сервисов (время представлено по поясу MSK в 24-часовом формате):<br/>\
&bull; <strong class="help-argument">bot.callbacks.clear</strong> \
— Сервис очистки inline-стека, очистка происходит в 03:00 каждый день.<br/>\
&bull; <strong class="help-argument">bot.avatars.update</strong> \
— Сервис обновления аватаров пользователей, обновление происходит в 04:00, 12:00 и 19:00 трижды в день.<br/>\
&bull; <strong class="help-argument">bot.motofan.receiver</strong> \
— Сервис получения новых сообщений с форума MotoFan.Ru, каждые 2 минуты производится проверка на новые сообщения.<br/>\
&bull; <strong class="help-argument">bot.motofan.birthday</strong> \
— Сервис отправки случайной фразы с добрым утром и дней рождений пользователей форума в Telegram-чат MotoFan.Ru, \
отчёт отправляется в 07:00 каждый день.<br/>\
&bull; <strong class="help-argument">bot.digest.shredder</strong> \
— Сервис очистки неактуальных дайджестов, очистка происходит в 05:00 по понедельникам.<br/>\
&bull; <strong class="help-argument">exchange.rates.update</strong> \
— Сервис получения и обновления котировок со всех официальных источников, \
получение и обновление происходит в 13:00 и 16:00 дважды в день.<br/>\
&bull; <strong class="help-argument">exchange.rates.send</strong> \
— Сервис отправки котировок валют подписчикам, отправка происходит в 14:00 каждый день.<br/>\
&bull; <strong class="help-argument">bot.covid.report</strong> \
— Сервис получения и отправки отчётов по пандемии COVID-19, \
получение и отправка отчётов происходит в 15:00 каждый день.<br/>\
&bull; <strong class="help-argument">flat.report.send</strong> \
— Сервис получения и отправки отчётов предложений недвижимости, \
получение и отправка отчётов происходит в 06:00 и 18:00 дважды в день.<br/><br/>\
<strong>Дополнительная функциональность, связанная с редактированием таблиц базы данных доступна из \
администраторского модуля.</strong>
