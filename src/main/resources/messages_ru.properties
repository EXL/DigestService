bot.command.start=\
Привет, я Гаечка!\n\
Для того чтобы получить список команд отправьте /help.
bot.command.hello=\
Привет, создатели!\n\
Хорошего дня, %username%!\n\
Привет. Я тут немного сломалась. Выправи меня следующим коммитом.\n\
Ого. Давно не виделись! Здравствуй.\n\
Я всё ещё тут. Привет :з\n\
Приветствую, брат. Чем я могу послужить тебе в этот прекрасный день?\n\
Привет тебе, мой разработчик!
bot.command.help=\
Помощь по командам няшки-бота:\n\
/digest — Показать последние сообщения с тегом `#digest`.\n\
/rate — Показать различные котировки.\n\
/chart — Показать различные графики котировок.\n\
/start — Приветствие.\n\
/coffee — Стикер с кофе.\n\
/game — Статистика игровых серверов.\n\
/subscribe — Подписаться на различные каналы.\n\
/help — Эта справка.
bot.command.help.moder=\
/greeting — Показывать приветствия в чате от бота.
bot.command.help.admin=\
/hello или /hi — Получить привет от бота.\n\
/show — Показать список записей дайджеста.\n\
/delete <id> — Удалить запись дайджеста под номером <id>.\n\
/send <chat id> <message> — Отправить <message> в <chat id>.\n\
/sticker <chat id> <sticker id> — Отправить стикер в <chat id>.\n\
/image <chat id> <image url> — Отправить фото в <chat id>.\n\
/debug — Показать команды для отладки.\n\
/info — Показать системную информацию.
