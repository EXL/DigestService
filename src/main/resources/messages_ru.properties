Выберите команду `/debug` с параметром:\n\n\
/debug VRates — Обновить котировки валют.\n\
/debug VRatesSub — Отправить котировки валют.\n\
/debug VPosts — Последние сообщения форума MotoFan.Ru.\n\
/debug VGithub — Коммиты GitHub проекта MotoFan.Ru.\n\
/debug VShredder — Запустить очистку базы данных.\n\
/debug VAvatars — Обновить аватары пользователей.\n\
/debug VQueries — Очистить стек inline-запросов.\n\
/debug VCovid — Отправить отчёт по COVID-19.\n\
/debug VBirthday — Отправить дни рождения MotoFan.Ru.\n\
/debug VFlat — Отправить варианты недвижимости.\n\
/debug BLogUpdates — Выводить updates в лог.\n\
/debug BGreetings — Отключить приветствия.\n\
/debug BBirthday — Отключить отправку дней рождения.\n\
/debug BCaptcha — Отключить использование CAPTCHA.\n\
/debug BSilent — Отключить отправку всех событий в чат.
